[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinxcontrib-programoutput"
description = "Sphinx extension to include program output"
readme = "README.rst"
authors = [
    {name = "Sebastian Wiesner", email = "lunaryorn@gmail.com"},
]
maintainers = [
    {name = "Jason Madden", email = "jason@seecoresoftware.com"},
]
license = {text = "BSD"}
requires-python = ">=3.8"
dependencies = [
    "Sphinx>=5.0.0",
]
keywords = [
    "sphinx", "cli", "command", "output", "program", "example"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Documentation",
    "Topic :: Utilities",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
]
dynamic = ["version"]


[project.optional-dependencies]
test = []
docs = [
    "furo",
]
ansi = ["sphinxcontrib-ansi"]

[tool.setuptools.dynamic]
version = {attr = "sphinxcontrib.programoutput.__version__"}

[tool.setuptools.packages.find]
where = ["./src"]
include = ["sphinxcontrib.programoutput"]